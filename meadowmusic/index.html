<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chesham United Festival — Control</title>
<style>
:root{
  --bg:#14171c;
  --panel:#1b1f26;
  --panel2:#20252d;
  --border:#2a2f38;
  --text:#e8eaed;
  --muted:#8b93a1;
  --accent:#f2a93b;
  --danger:#e2574c;
  --success:#4caf7d;
  --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;}
#app{display:flex;min-height:100vh;}
#sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
#brand{padding:18px 16px 14px;border-bottom:1px solid var(--border);}
#brand .name{font-weight:700;font-size:15px;letter-spacing:0.02em;}
#brand .sub{color:var(--muted);font-size:11px;margin-top:2px;text-transform:uppercase;letter-spacing:0.08em;}
nav{flex:1;overflow-y:auto;padding:10px 0;}
nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:var(--muted);padding:9px 16px;text-align:left;font-size:12.5px;cursor:pointer;border-left:3px solid transparent;}
nav button:hover{color:var(--text);background:var(--panel2);}
nav button.active{color:var(--text);background:var(--panel2);border-left-color:var(--accent);font-weight:600;}
#healthbar{padding:14px 16px;border-top:1px solid var(--border);}
#healthbar .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
#healthbar .figure{font-family:var(--mono);font-size:19px;font-weight:600;}
#healthbar .sub{font-size:11px;color:var(--muted);margin-top:2px;}
#iobar{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;}
#iobar button{flex:1;font-size:11px;padding:6px 4px;}
#main{flex:1;padding:28px 34px;max-width:1180px;}
h1{font-size:20px;margin:0 0 4px;}
h2{font-size:15px;margin:26px 0 10px;color:var(--text);border-bottom:1px solid var(--border);padding-bottom:6px;}
.pageDesc{color:var(--muted);font-size:12.5px;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;margin-bottom:10px;}
th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;padding:6px 6px;border-bottom:1px solid var(--border);}
td{padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:var(--panel2);}
input, select, textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 7px;border-radius:5px;font-size:12.5px;font-family:var(--sans);width:100%;}
input[type=number]{font-family:var(--mono);}
textarea{min-height:70px;resize:vertical;}
button.btn{background:var(--accent);color:#1a1305;border:none;padding:7px 14px;border-radius:5px;font-weight:600;font-size:12.5px;cursor:pointer;}
button.btn:hover{filter:brightness(1.08);}
button.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
button.icon{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px;}
button.icon:hover{color:var(--danger);}
.row-actions{white-space:nowrap;width:32px;}
.mono{font-family:var(--mono);}
.right{text-align:right;}
.muted{color:var(--muted);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;}
.card .kpi{font-family:var(--mono);font-size:24px;font-weight:700;}
.card .kpiLabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.pos{color:var(--success);} .neg{color:var(--danger);}
.addRow{margin-top:6px;}
.saveNote{font-size:11px;color:var(--muted);margin-top:4px;height:14px;}
.status-pill{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;display:inline-block;}
.status-green{background:rgba(76,175,125,0.15);color:var(--success);}
.status-amber{background:rgba(242,169,59,0.15);color:var(--accent);}
.status-red{background:rgba(226,87,76,0.15);color:var(--danger);}
::placeholder{color:#565d6b;}
.stageHead{font-size:9.5px;letter-spacing:0.04em;}
.plTable td, .plTable th{padding:8px 10px;}
.plTable th.stage{text-align:right;}
.plTable td.stage{text-align:right;font-family:var(--mono);}
</style>
</head>

let data = null;
let currentPage = 'overview';
let saveTimer = null;
const SUPABASE_URL = 'https://hmtqjljbiheckqeenbbb.supabase.co/rest/v1/';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtdHFqbGpiaWhlY2txZWVuYmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNTE1MTksImV4cCI6MjEwMDgyNzUxOX0.WZ20CycKJQ9kXg5kq9R49I9c35xov0LjWpOT0NlEDUA';
const ROW_ID = 'main';
const LOCAL_BACKUP_KEY = 'chesham-festival-plan-backup';

function supabaseHeaders(extra={}){
  return Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer '+SUPABASE_KEY,
    'Content-Type': 'application/json'
  }, extra);
}

async function loadData(){
  setSyncStatus('Loading…');
  try{
    const res = await fetch(`${SUPABASE_URL}festival_plan?id=eq.${ROW_ID}&select=data`, {headers: supabaseHeaders()});
    if(!res.ok) throw new Error('fetch failed '+res.status);
    const json = await res.json();
    if(json && json.length>0 && json[0].data){
      data = json[0].data;
      setSyncStatus('Synced');
    } else {
      data = JSON.parse(JSON.stringify(DEFAULT_DATA));
      await saveNow();
      setSyncStatus('Synced');
    }
  }catch(e){
    console.error('load failed, falling back to local backup', e);
    const raw = localStorage.getItem(LOCAL_BACKUP_KEY);
    data = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_DATA));
    setSyncStatus('Offline — using local backup');
  }
  migrateData();
  render();
}

function migrateData(){
  if(!data.ticketDays) data.ticketDays = JSON.parse(JSON.stringify(DEFAULT_DATA.ticketDays));
  if(data.projectedSellThrough===undefined) data.projectedSellThrough = 70;
  if(!data.otherIncome) data.otherIncome = [];
  if(!data.artists) data.artists = [];
  if(!data.cateringSettings || data.cateringSettings.breakfastCost!==undefined){
    data.cateringSettings = JSON.parse(JSON.stringify(DEFAULT_DATA.cateringSettings));
  }
  if(!data.cateringDays) data.cateringDays = [];
  (data.ticketTiers||[]).forEach(t=>{
    if(t.allocation===undefined){
      let matchDay = data.ticketDays.find(d=>d.name===t.day);
      if(!matchDay && t.day){ matchDay = {id:cid(), name:t.day, capacity:Number(t.capacity)||0}; data.ticketDays.push(matchDay); }
      t.dayId = matchDay ? matchDay.id : (data.ticketDays[0] && data.ticketDays[0].id);
      t.allocation = t.capacity!==undefined ? t.capacity : 0;
    }
    if(!t.dayIds){ t.dayIds = t.dayId ? [t.dayId] : []; }
  });
  (data.budget.categories||[]).forEach(cat=>{
    if(cat.estimate===undefined){
      cat.estimate = cat.budgeted!==undefined ? cat.budgeted : 0;
      cat.quoted = cat.estimate;
      if(cat.actual===undefined) cat.actual = 0;
    }
    if(!cat.group){
      const defaultMatch = DEFAULT_DATA.budget.categories.find(d=>d.name===cat.name);
      cat.group = defaultMatch ? defaultMatch.group : 'Production';
    }
  });
  DEFAULT_DATA.budget.categories.forEach(defCat=>{
    const exists = data.budget.categories.some(c=>c.name===defCat.name);
    if(!exists){
      data.budget.categories.push({id:cid(), name:defCat.name, group:defCat.group, estimate:0, quoted:0, actual:0, linked:defCat.linked});
    }
  });
  (data.staffing||[]).forEach(s=>{
    if(s.rateEstimate===undefined){
      const r = Number(s.rate)||0;
      s.rateEstimate = r; s.rateQuoted = r; s.rateActual = r;
    }
  });
}

async function saveNow(){
  try{
    localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(data));
  }catch(e){ /* ignore local backup failure */ }
  try{
    const res = await fetch(`${SUPABASE_URL}festival_plan`, {
      method:'POST',
      headers: supabaseHeaders({'Prefer':'resolution=merge-duplicates'}),
      body: JSON.stringify({id: ROW_ID, data: data, updated_at: new Date().toISOString()})
    });
    if(!res.ok) throw new Error('save failed '+res.status);
    setSyncStatus('Synced');
    return true;
  }catch(e){
    console.error('save failed', e);
    setSyncStatus('Offline — saved locally only');
    return false;
  }
}

function save(noteEl){
  clearTimeout(saveTimer);
  setSyncStatus('Saving…');
  saveTimer = setTimeout(async ()=>{
    const ok = await saveNow();
    if(noteEl){
      const elx = document.getElementById(noteEl);
      if(elx) elx.textContent = ok ? 'Saved' : 'Save failed — check connection';
      if(ok) setTimeout(()=>{ if(elx) elx.textContent=''; }, 1200);
    }
    updateHealthbar();
  }, 400);
}
function setSyncStatus(text){
  const s = document.getElementById('syncStatus');
  if(s) s.textContent = text;
}

function fmt(n){ n = Number(n)||0; return '£' + n.toLocaleString('en-GB', {maximumFractionDigits:0}); }

/* ---- Budget aggregates (three stages) ---- */
function totalBudgetStage(stage){ return data.budget.categories.reduce((s,c)=>s+(Number(c[stage])||0),0); }

/* ---- Artist fees ---- */
function artistTotalStage(stage){ return data.artists.reduce((s,a)=>s+(Number(a[stage])||0),0); }

/* ---- Crew ---- */
function crewCost(s, stage){ return (Number(s.headcount)||0)*(Number(s.numDays)||0)*(Number(s['rate'+cap1(stage)])||0); }
function cap1(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function totalCrewStage(stage){ return data.staffing.reduce((sum,s)=>sum+crewCost(s,stage),0); }

/* ---- Catering ---- */
function cateringRowCost(row, stage){
  const cs = data.cateringSettings;
  let mealCost = 0;
  if(row.breakfast) mealCost += Number(cs.breakfast[stage])||0;
  if(row.lunch) mealCost += Number(cs.lunch[stage])||0;
  if(row.dinner) mealCost += Number(cs.dinner[stage])||0;
  return mealCost * (Number(row.headcount)||0);
}
function totalCateringStage(stage){ return data.cateringDays.reduce((s,r)=>s+cateringRowCost(r,stage),0); }

/* ---- Ticketing ---- */
function ticketRevenue(){ return data.ticketTiers.reduce((s,t)=>s+((Number(t.price)||0)*(Number(t.sold)||0)),0); }
function ticketPotentialRevenue(){ return data.ticketTiers.reduce((s,t)=>s+((Number(t.price)||0)*(Number(t.allocation)||0)),0); }
function ticketProjectedRevenue(pct){ return data.ticketTiers.reduce((s,t)=>s+((Number(t.price)||0)*(Number(t.allocation)||0)*(Number(pct)||0)/100),0); }
function dayAllocated(dayId){ return data.ticketTiers.filter(t=>(t.dayIds||[]).includes(dayId)).reduce((s,t)=>s+(Number(t.allocation)||0),0); }
function totalDayCapacity(){ return data.ticketDays.reduce((s,d)=>s+(Number(d.capacity)||0),0); }
function totalAllocated(){ return data.ticketTiers.reduce((s,t)=>s+(Number(t.allocation)||0),0); }

/* ---- Other income ---- */
function otherIncomeStage(stage){ return data.otherIncome.reduce((s,o)=>s+(Number(o[stage])||0),0); }
function merchRevenue(){ return data.merch.reduce((s,m)=>s+((Number(m.price)||0)*(Number(m.sold)||0)),0); }

/* ---- Overall P&L by stage ----
   Estimate: projected ticket revenue at sell-through % + other income estimate + merch revenue (actual sold, since merch has no separate stages)
   Quoted:   ticket potential (full sell-out of current allocations) + other income quoted
   Actual:   real ticket revenue sold + other income actual + merch revenue
*/
function revenueStage(stage){
  if(stage==='estimate') return ticketProjectedRevenue(data.projectedSellThrough) + otherIncomeStage('estimate') + merchRevenue();
  if(stage==='quoted') return ticketPotentialRevenue() + otherIncomeStage('quoted') + merchRevenue();
  return ticketRevenue() + otherIncomeStage('actual') + merchRevenue();
}
function costsStage(stage){ return totalBudgetStage(stage); }
function netStage(stage){ return revenueStage(stage) - costsStage(stage); }

function avgTicketPrice(){
  const withPrice = data.ticketTiers.filter(t=>Number(t.price)>0);
  if(withPrice.length===0) return 0;
  return withPrice.reduce((s,t)=>s+(Number(t.price)||0),0)/withPrice.length;
}
function costsToCover(){ return costsStage('actual') - (merchRevenue()+otherIncomeStage('actual')); }
function breakevenTickets(){
  const avg = avgTicketPrice();
  if(avg<=0) return 0;
  return Math.max(0, Math.ceil(costsToCover()/avg));
}

function updateHealthbar(){
  const net = netStage('actual');
  const fig = document.getElementById('hb-figure');
  const sub = document.getElementById('hb-sub');
  fig.textContent = fmt(net);
  fig.className = 'figure ' + (net>=0?'pos':'neg');
  sub.textContent = `${fmt(revenueStage('actual'))} in · ${fmt(costsStage('actual'))} spent`;
}

function render(){
  renderNav();
  renderPage();
  updateHealthbar();

}

    b.innerHTML = `<span>${p.icon}</span><span>${p.label}</span>`;
    b.onclick = ()=>{ currentPage = p.id; render(); };
    nav.appendChild(b);
  });
}
function renderPage(){
  const main = document.getElementById('main');

    overview: pageOverview, budget: pageBudget, artists: pageArtists,
    ticketing: pageTicketing, income: pageIncome, catering: pageCatering,
    staffing: pageStaffing, merch: pageMerch, contacts: pageContacts,
    schedule: pageSchedule, advancing: pageAdvancing, sitemap: pageSitemap,
    eventcontrol: pageEventControl, healthsafety: pageHealthSafety
  };
  renderers[currentPage](main);
}
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='html') e.innerHTML = v;
    else if(k==='text') e.textContent = v;
    else if(k.startsWith('on')) e[k]=v;
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c) e.appendChild(c); });
  return e;
}
function labeled(label, inputEl){
  const wrap = el('div');
  wrap.appendChild(el('div',{class:'muted',style:'font-size:11px;margin-bottom:4px;',text:label}));
  wrap.appendChild(inputEl);
  return wrap;
}

function pageOverview(main){
  main.appendChild(el('h1',{text:data.eventName}));
  main.appendChild(el('div',{class:'pageDesc',text:`Multi-day festival at Chesham United FC · ${data.days} days`}));

  main.appendChild(feasCard);

}

/* ================= BUDGET ================= */
function pageBudget(main){
  main.appendChild(el('h1',{text:'Budget'}));
  main.appendChild(el('div',{class:'pageDesc',text:'Every cost line with Estimate, Quoted and Actual. Crew, Catering and Artist Fees pull their totals from their own tabs — use the push buttons there to sync.'}));

  main.appendChild(el('h2',{text:'Ticket pricing (sliding scale)'}));
  if(data.ticketTiers.length===0){
    main.appendChild(el('div',{class:'muted',text:'No ticket tiers yet — set these on the Ticketing tab.'}));
  } else {
    const tt = el('table');
    tt.appendChild(el('tr',{html:'<th>Tier</th><th>Access days</th><th class="right">Price</th><th class="right">Allocation</th><th class="right">Sold</th>'}));
    data.ticketTiers.forEach(t=>{
      const dayNames = (t.dayIds||[]).map(id=>{ const d=data.ticketDays.find(x=>x.id===id); return d?d.name:''; }).filter(Boolean).join(', ');
      const tr = document.createElement('tr');
      tr.appendChild(el('td',{text:t.name}));
      tr.appendChild(el('td',{class:'muted',text:dayNames}));
      tr.appendChild(el('td',{class:'right mono',text:fmt(t.price)}));
      tr.appendChild(el('td',{class:'right mono',text:(Number(t.allocation)||0).toLocaleString()}));
      tr.appendChild(el('td',{class:'right mono',text:(Number(t.sold)||0).toLocaleString()}));
      tt.appendChild(tr);
    });
    main.appendChild(tt);
  }

  main.appendChild(el('h2',{text:'Cost categories'}));
  main.appendChild(el('div',{class:'muted',style:'font-size:12px;margin-bottom:8px;',text:'Grouped into Production, Site, Event Management, Licensing and Contingency. Change a category\'s group from the dropdown to move it.'}));

  const groupsWithCats = BUDGET_GROUPS.map(g=>({group:g, cats: data.budget.categories.filter(c=>c.group===g)}));
  const ungrouped = data.budget.categories.filter(c=>!BUDGET_GROUPS.includes(c.group));
  if(ungrouped.length) groupsWithCats.push({group:'Other', cats:ungrouped});

  groupsWithCats.forEach(({group, cats})=>{
    const groupWrap = el('div',{style:'margin-bottom:22px;'});
    const groupHeadRow = el('div',{style:'display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;'});
    groupHeadRow.appendChild(el('div',{style:'font-weight:600;font-size:13px;',text:group}));
    const subEst = cats.reduce((s,c)=>s+(Number(c.estimate)||0),0);
    const subAct = cats.reduce((s,c)=>s+(Number(c.actual)||0),0);
    groupHeadRow.appendChild(el('div',{class:'muted mono',style:'font-size:12px;',id:'grouptotal-'+group.replace(/\s+/g,''),text:`Est ${fmt(subEst)} · Actual ${fmt(subAct)}`}));
    groupWrap.appendChild(groupHeadRow);

    const table = el('table');
    table.appendChild(el('tr',{html:'<th>Category</th><th>Group</th><th class="right">Estimate</th><th class="right">Quoted</th><th class="right">Actual</th><th class="right">Variance</th><th></th>'}));
    cats.forEach(cat=>{
      const tr = document.createElement('tr');
      const nameInput = el('input',{value:cat.name});
      nameInput.oninput = ()=>{ cat.name = nameInput.value; save('budget-note'); };
      const groupSelect = el('select');
      BUDGET_GROUPS.forEach(g=>{ const o=el('option',{value:g,text:g}); if(cat.group===g) o.selected=true; groupSelect.appendChild(o); });
      groupSelect.onchange = ()=>{ cat.group = groupSelect.value; save('budget-note'); renderPage(); };
      const estInput = el('input',{type:'number',value:cat.estimate});
      estInput.oninput = ()=>{ cat.estimate = estInput.value; save('budget-note'); renderBudgetTotals(); };
      const quotedInput = el('input',{type:'number',value:cat.quoted});
      quotedInput.oninput = ()=>{ cat.quoted = quotedInput.value; save('budget-note'); renderBudgetTotals(); };
      const actualInput = el('input',{type:'number',value:cat.actual});
      actualInput.oninput = ()=>{ cat.actual = actualInput.value; save('budget-note'); renderBudgetTotals(); };
      if(cat.linked){ [estInput,quotedInput,actualInput].forEach(i=>i.title='Linked to '+cat.linked+' tab — edit there and push, or override here.'); }
      const variance = (Number(cat.estimate)||0)-(Number(cat.actual)||0);
      const varTd = el('td',{class:'right mono '+(variance>=0?'pos':'neg'),text:fmt(variance)});
      varTd.id = 'var-'+cat.id;
      tr.appendChild(el('td',{},nameInput));
      tr.appendChild(el('td',{},groupSelect));
      tr.appendChild(el('td',{class:'right'},estInput));
      tr.appendChild(el('td',{class:'right'},quotedInput));
      tr.appendChild(el('td',{class:'right'},actualInput));
      tr.appendChild(varTd);
      const delBtn = el('button',{class:'icon',text:'✕'});
      delBtn.onclick = ()=>{ data.budget.categories = data.budget.categories.filter(c=>c.id!==cat.id); save('budget-note'); renderPage(); };
      tr.appendChild(el('td',{class:'row-actions'},delBtn));
      table.appendChild(tr);
    });
    groupWrap.appendChild(table);
    main.appendChild(groupWrap);
  });

  const addBtn = el('button',{class:'btn secondary addRow',text:'+ Add category'});
  addBtn.onclick = ()=>{ data.budget.categories.push({id:cid(),name:'New category',group:'Production',estimate:0,quoted:0,actual:0}); save('budget-note'); renderPage(); };
  main.appendChild(addBtn);
  main.appendChild(el('div',{class:'saveNote',id:'budget-note'}));

  main.appendChild(el('h2',{text:'Totals'}));
  const grid = el('div',{style:'display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;'});
  [
    ['Total Estimate', fmt(totalBudgetStage('estimate')), 'kpi-est'],
    ['Total Quoted', fmt(totalBudgetStage('quoted')), 'kpi-quo'],
    ['Total Actual', fmt(totalBudgetStage('actual')), 'kpi-act'],
    ['Net Position (Actual)', fmt(netStage('actual')), 'kpi-net'],
  ].forEach(([label,val,idv])=>{
    const c = el('div',{class:'card'});
    c.appendChild(el('div',{class:'kpiLabel',text:label}));
    const kpi = el('div',{class:'kpi',id:idv,text:val});
    if(idv==='kpi-net') kpi.classList.add(netStage('actual')>=0?'pos':'neg');
    c.appendChild(kpi);
    grid.appendChild(c);
  });
  main.appendChild(grid);
}
function renderBudgetTotals(){
  data.budget.categories.forEach(cat=>{
    const v = document.getElementById('var-'+cat.id);
    if(v){
      const variance = (Number(cat.estimate)||0)-(Number(cat.actual)||0);
      v.textContent = fmt(variance);
      v.className = 'right mono '+(variance>=0?'pos':'neg');
    }
  });
  const allGroups = BUDGET_GROUPS.concat(['Other']);
  allGroups.forEach(group=>{
    const cats = data.budget.categories.filter(c=> group==='Other' ? !BUDGET_GROUPS.includes(c.group) : c.group===group);
    const t = document.getElementById('grouptotal-'+group.replace(/\s+/g,''));
    if(t){
      const subEst = cats.reduce((s,c)=>s+(Number(c.estimate)||0),0);
      const subAct = cats.reduce((s,c)=>s+(Number(c.actual)||0),0);
      t.textContent = `Est ${fmt(subEst)} · Actual ${fmt(subAct)}`;
    }
  });
  const e1=document.getElementById('kpi-est'); if(e1) e1.textContent=fmt(totalBudgetStage('estimate'));
  const e2=document.getElementById('kpi-quo'); if(e2) e2.textContent=fmt(totalBudgetStage('quoted'));
  const e3=document.getElementById('kpi-act'); if(e3) e3.textContent=fmt(totalBudgetStage('actual'));
  const n=document.getElementById('kpi-net'); if(n){ n.textContent=fmt(netStage('actual')); n.className='kpi '+(netStage('actual')>=0?'pos':'neg'); }
}
function pushToBudget(categoryName, stageValues){
  const cat = data.budget.categories.find(c=>c.name===categoryName);
  if(!cat) return;
  cat.estimate = stageValues.estimate; cat.quoted = stageValues.quoted; cat.actual = stageValues.actual;
}

function renderTicketTotals(){
  data.ticketTiers.forEach(t=>{
    const r = document.getElementById('rev-'+t.id); if(r) r.textContent = fmt((Number(t.price)||0)*(Number(t.sold)||0));
    const p = document.getElementById('pot-'+t.id); if(p) p.textContent = fmt((Number(t.price)||0)*(Number(t.allocation)||0));
  });
  data.ticketDays.forEach(d=>{
    const allocated = dayAllocated(d.id);
    const over = allocated > (Number(d.capacity)||0);
    const a = document.getElementById('dayalloc-'+d.id);
    if(a){ a.textContent = allocated.toLocaleString(); a.className = 'right mono '+(over?'neg':''); }
    const s = document.getElementById('daystatus-'+d.id);
    if(s){ s.textContent = over?'Over cap':'OK'; s.className = 'status-pill '+(over?'status-red':'status-green'); }
  });

    tr.appendChild(el('td',{},dayInput));
    tr.appendChild(el('td',{},arrivalInput));
    tr.appendChild(el('td',{},notesInput));
    tr.appendChild(el('td',{},statusSelect));
    const delBtn = el('button',{class:'icon',text:'✕'});
    delBtn.onclick=()=>{ data.advancing = data.advancing.filter(x=>x.id!==a.id); save('adv-note'); renderPage(); };
    tr.appendChild(el('td',{class:'row-actions'},delBtn));
    table.appendChild(tr);
  });
  main.appendChild(table);
  const addBtn = el('button',{class:'btn secondary addRow',text:'+ Add act/supplier'});
  addBtn.onclick=()=>{ data.advancing.push({id:cid(),name:'',day:'Day 1',arrival:'',notes:'',status:'Not started'}); save('adv-note'); renderPage(); };
  main.appendChild(addBtn);
  main.appendChild(el('div',{class:'saveNote',id:'adv-note'}));
}

/* ================= SITE MAP ================= */

/* ================= EVENT CONTROL ================= */
function pageEventControl(main){
  main.appendChild(el('h1',{text:'Event Control'}));
  main.appendChild(el('div',{class:'pageDesc',text:'Live incident/decision log during the event.'}));
  const table = el('table');

    const entryInput = el('input',{value:l.entry||''}); entryInput.oninput=()=>{l.entry=entryInput.value;save('ec-note');};
    const byInput = el('input',{value:l.by||''}); byInput.oninput=()=>{l.by=byInput.value;save('ec-note');};

    ['Open','Monitoring','Resolved'].forEach(opt=>{ const o=el('option',{value:opt,text:opt}); if(l.status===opt) o.selected=true; statusSelect.appendChild(o); });

    tr.appendChild(el('td',{},timeInput));
    tr.appendChild(el('td',{},entryInput));
    tr.appendChild(el('td',{},byInput));
    tr.appendChild(el('td',{},statusSelect));
    const delBtn = el('button',{class:'icon',text:'✕'});
    delBtn.onclick=()=>{ data.eventControlLog = data.eventControlLog.filter(x=>x.id!==l.id); save('ec-note'); renderPage(); };
    tr.appendChild(el('td',{class:'row-actions'},delBtn));
    table.appendChild(tr);
  });
  main.appendChild(table);
  const addBtn = el('button',{class:'btn secondary addRow',text:'+ Add log entry'});
  addBtn.onclick=()=>{
    const now = new Date();
    data.eventControlLog.push({id:cid(),time:now.toTimeString().slice(0,5),entry:'',by:'',status:'Open'});

  main.appendChild(addBtn);
  main.appendChild(el('div',{class:'saveNote',id:'ec-note'}));
}

/* ================= HEALTH & SAFETY ================= */
function pageHealthSafety(main){
  main.appendChild(el('h1',{text:'Health & Safety'}));
  main.appendChild(el('div',{class:'pageDesc',text:'Risk items, mitigation, owner and sign-off status.'}));
  const table = el('table');
  table.appendChild(el('tr',{html:'<th>Risk</th><th>Mitigation</th><th>Owner</th><th>Risk level</th><th>Signed off</th><th></th>'}));
  data.healthSafety.forEach(h=>{
    const tr = document.createElement('tr');
    const riskInput = el('input',{value:h.risk||''}); riskInput.oninput=()=>{h.risk=riskInput.value;save('hs-note');};
    const mitInput = el('input',{value:h.mitigation||''}); mitInput.oninput=()=>{h.mitigation=mitInput.value;save('hs-note');};
    const ownerInput = el('input',{value:h.owner||''}); ownerInput.oninput=()=>{h.owner=ownerInput.value;save('hs-note');};
    const levelSelect = el('select');
    ['Low','Medium','High'].forEach(opt=>{ const o=el('option',{value:opt,text:opt}); if(h.level===opt) o.selected=true; levelSelect.appendChild(o); });
    levelSelect.onchange = ()=>{ h.level = levelSelect.value; save('hs-note'); };
    const signedInput = document.createElement('input');
    signedInput.type='checkbox'; signedInput.checked=!!h.signed; signedInput.style.width='auto';
    signedInput.onchange = ()=>{ h.signed = signedInput.checked; save('hs-note'); };
    tr.appendChild(el('td',{},riskInput));
    tr.appendChild(el('td',{},mitInput));
    tr.appendChild(el('td',{},ownerInput));
    tr.appendChild(el('td',{},levelSelect));
    tr.appendChild(el('td',{style:'text-align:center;'},signedInput));
    const delBtn = el('button',{class:'icon',text:'✕'});
    delBtn.onclick=()=>{ data.healthSafety = data.healthSafety.filter(x=>x.id!==h.id); save('hs-note'); renderPage(); };
    tr.appendChild(el('td',{class:'row-actions'},delBtn));
    table.appendChild(tr);
  });
  main.appendChild(table);
  const addBtn = el('button',{class:'btn secondary addRow',text:'+ Add risk item'});
  addBtn.onclick=()=>{ data.healthSafety.push({id:cid(),risk:'',mitigation:'',owner:'',level:'Medium',signed:false}); save('hs-note'); renderPage(); };
  main.appendChild(addBtn);
  main.appendChild(el('div',{class:'saveNote',id:'hs-note'}));
}

/* ================= IMPORT / EXPORT / REFRESH ================= */
document.getElementById('refreshBtn').onclick = ()=>{ loadData(); };
document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `festival-plan-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=>{ document.getElementById('importFile').click(); };
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const imported = JSON.parse(reader.result);
      data = imported;
      migrateData();
      save();
      render();
    }catch(err){
      alert('Could not read that file — make sure it is a festival plan JSON export.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

loadData();
</script>
