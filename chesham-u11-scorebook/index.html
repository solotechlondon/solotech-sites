<title>Chesham U11 Scorebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column, scoreboard first, three tabs pinned to the bottom (Match, Squad, Results). */
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --surface2:#E8EBE6; --fg:#171A17; --muted:#58615A; --line:#D3D9D1;
  --claret:#7A1F33; --on-claret:#FFFFFF; --accent-text:#7A1F33; --soft-claret:#F3E4E8; --green:#1E5E3C;
  --win:#1D7A46; --draw:#8A6200; --loss:#B3261E; --focus:#1E5E3C;
  --board-bg:#151A16; --board-fg:#FFFFFF; --board-muted:#A9B3AB; --board-line:#34403A; --bar:#C4506A;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Lexend','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111411; --surface:#1A1E1A; --surface2:#252A25; --fg:#EEF1EC; --muted:#A3ADA5; --line:#2E352F;
    --claret:#B23A56; --on-claret:#FFFFFF; --accent-text:#EE9AAE; --soft-claret:#3A1C25; --green:#4CC585;
    --win:#4CC585; --draw:#E0B040; --loss:#F0776E; --focus:#8FD9AE;
    --board-bg:#0A0C0A; --board-line:#2A332D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111411; --surface:#1A1E1A; --surface2:#252A25; --fg:#EEF1EC; --muted:#A3ADA5; --line:#2E352F;
  --claret:#B23A56; --on-claret:#FFFFFF; --accent-text:#EE9AAE; --soft-claret:#3A1C25; --green:#4CC585;
  --win:#4CC585; --draw:#E0B040; --loss:#F0776E; --focus:#8FD9AE;
  --board-bg:#0A0C0A; --board-line:#2A332D; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--f-body);padding-inline:16px;padding-block:0}
html.lock{overflow:hidden}
#app{max-width:560px;margin-inline:auto;padding-bottom:110px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h2,h3,p{margin:0}
ul{list-style:none;margin:0;padding:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 8px}
.club{font:700 28px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.club small{display:block;font:500 13px/1.4 var(--f-body);letter-spacing:.04em;text-transform:none;color:var(--muted);margin-top:4px}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--win)}
.sync[data-s="saving"]::before,.sync[data-s="loading"]::before{background:var(--draw)}
.sync[data-s="error"]::before{background:var(--loss)}
.sync[data-s="local"]::before{background:var(--muted)}

main{display:flex;flex-direction:column;gap:16px;padding-block:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font:600 13px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.hint{color:var(--muted);font-size:14px}

.btn{min-height:52px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--claret);border-color:var(--claret);color:var(--on-claret)}
.btn.big{min-height:64px;font-size:18px;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--loss);border-color:var(--loss);background:transparent}
.btn.wide{width:100%}
.btn[data-sure="1"]{background:var(--loss);border-color:var(--loss);color:#fff}

.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.live{background:var(--claret);color:var(--on-claret)}
.pill.W{background:var(--win);color:#fff}.pill.D{background:var(--draw);color:#fff}.pill.L{background:var(--loss);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.W,:root:not([data-theme="light"]) .pill.D,:root:not([data-theme="light"]) .pill.L{color:#0E120E}}
:root[data-theme="dark"] .pill.W,:root[data-theme="dark"] .pill.D,:root[data-theme="dark"] .pill.L{color:#0E120E}

.fix-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vs{font:700 34px/1.05 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere}
.date{color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.facts div{background:var(--surface2);border-radius:10px;padding:8px 12px}
.facts dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font:700 24px/1.2 var(--f-display)}
.venue{overflow-wrap:anywhere;user-select:text}
.venue b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.links{display:flex;gap:16px;flex-wrap:wrap}
.links a,.links button{color:var(--accent-text);font-weight:600;background:none;border:0;padding:8px 0;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.board{background:var(--board-bg);color:var(--board-fg);border-radius:16px;padding:18px 10px 12px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;text-align:center}
.board .tname{font:600 14px/1.25 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--board-muted);min-height:2.5em;overflow-wrap:anywhere;padding-inline:4px}
.board .score{font:700 104px/.95 var(--f-display);font-variant-numeric:tabular-nums}
.board .sep{width:22px;height:6px;border-radius:3px;background:var(--bar);margin-top:62px}
.board .mini{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--board-line);background:transparent;color:var(--board-muted);cursor:pointer;margin-top:4px}

.goals{display:flex;flex-direction:column}
.goal{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding-block:6px;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal .min{font:700 22px/1 var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.goal.us .who b{color:var(--accent-text)}
.goal .who{overflow-wrap:anywhere}
.x{min-width:44px;min-height:44px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:24px;cursor:pointer}
.x[data-sure="1"]{background:var(--loss);color:#fff;font-size:13px;font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:92px;max-width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.chip b{font:700 28px/1 var(--f-display)}
.chip span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chip em{font-style:normal;font-size:13px;font-weight:600;color:var(--accent-text)}

.who-list li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.who-list li:first-child{border-top:0}
.shirt{font:700 28px/1 var(--f-display);text-align:center;background:var(--surface2);border-radius:10px;padding:8px 0}
.shirt.none{color:var(--muted)}
.tag{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px}
.goalsn{font-size:14px;font-weight:600;color:var(--accent-text)}

.prow{display:grid;grid-template-columns:64px minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding-block:6px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.field{width:100%;min-height:48px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.field.pnum{text-align:center;font:700 24px/1 var(--f-display);padding-inline:4px}
.gk{display:flex;align-items:center;gap:6px;font-size:14px;min-height:44px}
.gk input{width:22px;height:22px;accent-color:var(--claret)}
.addrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px}
label.lab{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
label.lab .field{color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:8px 12px}
.stat b{display:block;font:700 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.mrow .d{font:700 20px/1.1 var(--f-display);text-transform:uppercase;color:var(--muted)}
.mrow .o{font-weight:600;overflow-wrap:anywhere}
.mrow .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.mrow .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mrow .r b{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{min-height:56px;border:0;background:transparent;border-radius:10px;font-weight:500;color:var(--muted);cursor:pointer;border-top:4px solid transparent}
.tab[aria-current="page"]{color:var(--accent-text);font-weight:600;border-top-color:var(--claret)}

.back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font:700 26px/1.1 var(--f-display);text-transform:uppercase}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{min-height:76px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;min-width:0}
.pick b{font:700 30px/1 var(--f-display)}
.pick span{font-size:13px;overflow-wrap:anywhere;text-align:center}
.pick.other{border-style:dashed;color:var(--muted)}
.sq{display:flex;flex-wrap:wrap;gap:8px}
.sq label{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.sq input{width:20px;height:20px;accent-color:var(--claret)}
.err{color:var(--loss);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:20;font-weight:500}
.empty{align-items:flex-start}
.clockrow{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.ctime{font:700 46px/1 var(--f-display);font-variant-numeric:tabular-nums}
.cper{font-size:13px;color:var(--muted);margin-top:4px}
.cbtns{display:flex;gap:8px}
.cbtns .btn{min-width:52px;padding-inline:12px}
.cbtns .btn.primary{min-width:84px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg)}
a.btn.primary{color:var(--on-claret)}
textarea.field{min-height:150px;line-height:1.5;resize:vertical}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-block:4px 8px}
.team{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 14px;text-align:left}
.team b{font:700 20px/1.1 var(--f-display);text-transform:uppercase}
.team span{font-size:13px;color:var(--muted)}
.team[aria-pressed="true"]{border-color:var(--claret);background:var(--soft-claret)}
.team[aria-pressed="true"] b{color:var(--accent-text)}
.wa{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px 6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sw{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer}
.sw input{width:24px;height:24px;accent-color:var(--claret);flex:none}
.lb{background:none;border:0;color:var(--accent-text);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:48px;padding:0 10px;cursor:pointer}
details summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600;color:var(--accent-text)}
.hdr-r{display:flex;align-items:center;gap:6px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
@media (prefers-reduced-motion: no-preference){.btn,.pick,.chip{transition:transform .08s}}

function sortedPlayers(list){

async function save(){
  if(!REMOTE){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}setStatus('local');return;}
  if(!ADMIN)return;
  dirty=true;
  if(writing)return;
  writing=true;
  try{
    while(dirty){
      dirty=false;setStatus('saving');
      var ok=await rpc('save_state',{pw:PW,doc:JSON.parse(JSON.stringify(S))});
      if(ok!==true){ADMIN=false;try{localStorage.removeItem(LS+'-pw');}catch(e){}setStatus('error');writing=false;render();return;}
    }
    setStatus('saved');
  }catch(e){dirty=false;setStatus('error');}
  writing=false;
}
function commit(){render();save();}
async function poll(){
  if(!REMOTE||S===null||writing||dirty)return;
  try{
    var d=await fetchState();
    if(writing||dirty)return;
    var next=normalise(d);
    if(JSON.stringify(next)===JSON.stringify(S)){if(ui.status!=='saved')setStatus('saved');return;}
    setS(next);setStatus('saved');
    var a=document.activeElement;
    if(a&&app.contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')){ui.defer=true;return;}
    render();
  }catch(e){}
}

async function pushInit(){

  try{var reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
    if(pushOk()){var sub=await reg.pushManager.getSubscription();PUSH.on=!!sub&&Notification.permission==='granted';if(PUSH.on){try{await rpc('add_sub',{s:sub.toJSON()});}catch(e){}}render();}}catch(e){}
}
async function autoPush(){
  try{if(!pushOk()||PUSH.on||Notification.permission!=='default'||localStorage.getItem(LS+'-pushask'))return;
    localStorage.setItem(LS+'-pushask','1');
    var reg=await navigator.serviceWorker.ready;

    var sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(CFG.vapid)});

async function togglePush(){
  if(!pushOk()){flash('Add to Home Screen first, then tap the bell');return;}
  try{
    var reg=await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription();
    if(PUSH.on&&sub){try{await rpc('remove_sub',{ep:sub.endpoint});}catch(e){}await sub.unsubscribe();PUSH.on=false;render();flash('Alerts off');return;}
    var perm=await Notification.requestPermission();

    sub=sub||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(CFG.vapid)});
    await rpc('add_sub',{s:sub.toJSON()});PUSH.on=true;render();flash('Alerts on');

function nextDay(t){

  while(d.getDay()!==target)d.setDate(d.getDate()+1);

/* match helpers */
function curMatch(){
  var tm=tMatches();
  if(!tm.length)return null;
  var m=byId(tm,ui.mid);
  if(m)return m;
  var pool=tm.filter(function(x){return x.status==='live';});
  if(!pool.length)pool=tm.filter(function(x){return x.status==='upcoming';}).sort(function(a,b){return String(a.date).localeCompare(String(b.date));});
  if(!pool.length)pool=tm.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date));});
  ui.mid=pool[0].id;
  return pool[0];
}
function elapsed(m){var c=m.clock;if(!c)return 0;return c.el+(c.run?Date.now()-c.at:0);}
function matchMs(m){var t=teamOf(m);return ((m.clock.p||1)-1)*t.len*60000+elapsed(m);}
function clockMin(m){var c=m.clock;if(!c||(!c.run&&!c.el&&(c.p||1)<2))return null;return Math.floor(matchMs(m)/60000)+1;}
function fmtClock(ms){var t=Math.max(0,Math.floor(ms/1000));return p2(Math.floor(t/60))+':'+p2(t%60);}
function clockLabel(m,e){var t=teamOf(m);var p=m.clock.p||1;var n=t.unit+' '+p+' of '+t.n;return m.clock.run?n:m.clock.brk?'Break after '+t.unit.toLowerCase()+' '+p:n+' (paused)';}
function stopClock(m){if(m.clock.run){m.clock.el=elapsed(m);m.clock.run=false;}}
function buildQuick(m){
  var g=m.goals.length?m.goals[m.goals.length-1]:null;
  var L=['\u26BD '+teamOf(m).name+' '+m.us+' - '+m.them+' '+m.opp];
  if(g){
    var who;
    if(g.team==='us'){var p=g.scorer&&g.scorer!=='og'?byId(S.players,g.scorer):null;who=g.scorer==='og'?'Own goal':p?p.name+(g.pen?' (pen)':''):'Chesham goal';}
    else who=m.opp+(g.num?' #'+g.num:' goal');
    L.push((g.min!=null?g.min+"' ":g.q?g.q+' ':'')+who);
  }

}
function buildMsg(m){
  var r=result(m);
  var L=['\u26BD '+(m.status==='final'?'FULL TIME':'LIVE')+(m.comp?' ('+m.comp+')':''),teamOf(m).name+' '+m.us+' - '+m.them+' '+m.opp,fmtDate(m.date)+(m.venue?', '+m.venue.split(',')[0]:''),''];
  if(m.goals.length){
    L.push('Goals');
    m.goals.map(function(g,i){return {g:g,i:i};}).sort(function(a,b){var am=a.g.min==null?9999:a.g.min,bm=b.g.min==null?9999:b.g.min;return am-bm||a.i-b.i;}).forEach(function(x){
      var g=x.g,who;
      if(g.team==='us'){var p=g.scorer&&g.scorer!=='og'?byId(S.players,g.scorer):null;who=g.scorer==='og'?'Own goal':p?p.name+(g.pen?' (pen)':''):'Chesham goal';}

function byId2(arr,n){for(var i=0;i<arr.length;i++){if(arr[i].num===n)return arr[i];}return null;}

    [].forEach.call(app.querySelectorAll('.adm,[data-act="newMatch"],[data-act="editMatch"],[data-act="quick"],[data-act="adj"],[data-act="openUs"],[data-act="openThem"],[data-act="status"],[data-act="share"],[data-act="waSetup"],.wa,[data-act="newOpp"],[data-act="delGoal"],[data-act="addPlayer"],[data-act="delPlayer"],.cbtns'),function(n){n.remove();});

function toast(msg){

/* actions */
function quickRead(){
  var sh=app.querySelector('.sheet');if(!sh||!ui.sheet||ui.sheet.type!=='quick')return null;
  var m=byId(S.matches,ui.sheet.id);if(!m)return null;
  [].forEach.call(sh.querySelectorAll('.qrow'),function(r){
    var g=byId(m.goals,r.getAttribute('data-gid'));if(!g)return;
    g.min=toInt(r.querySelector('[data-q=min]').value);
    var w=r.querySelector('[data-q=who]');if(w)g.scorer=w.value||null;
    var nn=r.querySelector('[data-q=num]');if(nn){g.num=cleanNum(nn.value)||null;if(g.num&&!byId2(m.oppNums,g.num))m.oppNums.push({num:g.num,note:''});}
  });
  var u=toInt($('#qUs').value),t=toInt($('#qThem').value);if(u!==null)m.us=Math.max(0,u);if(t!==null)m.them=Math.max(0,t);
  var k=$('#qKo').value;if(k)m.ko=k;
  return m;
}
function minuteVal(){var el=$('#gMin');return el?toInt(el.value):null;}
function addGoal(team,extra){
  var m=curMatch();var g={id:uid(),team:team,min:minuteVal()};
  for(var k in extra)g[k]=extra[k];
  var had=m.goals.filter(function(x){return x.team===team;}).length;
  m.goals.push(g);if(!(m.status==='final'&&m[team]>had))m[team]=(m[team]||0)+1;
  if(m.status==='upcoming')m.status='live';
  if(m.status==='live'){pushWA(m);var qq=buildQuick(m).split('\n');pushNotify(qq[0],qq[1]||'',m);}
  ui.sheet=null;toast('Goal added');commit();
}
function addThem(numStr){
  var m=curMatch();var n=cleanNum(numStr);
  if(n&&!byId2(m.oppNums,n))m.oppNums.push({num:n,note:''});
  addGoal('them',{num:n||null});
}
function adjust(team){
  var m=curMatch();
  var mine=m.goals.filter(function(g){return g.team===team;});
  if(m[team]>mine.length){m[team]--;}
  else if(mine.length){var last=mine[mine.length-1];m.goals=m.goals.filter(function(g){return g!==last;});m[team]=Math.max(0,m[team]-1);}
  commit();
}
function addPlayer(){
  var nm=$('#nName'),nu=$('#nNum');var name=nm.value.trim();
  if(!name){nm.focus();return;}
  S.players.push({id:uid(),name:name,num:cleanNum(nu.value),gk:false,teamId:ui.team});
  commit();var n2=$('#nName');if(n2)n2.focus();
}
function saveOpp(){
  var m=curMatch();var n=cleanNum($('#oNum').value);var note=$('#oNote').value.trim();
  if(!n){$('#oErr').hidden=false;$('#oNum').focus();return;}
  var old=ui.sheet.num;
  if(old&&old!==n){
    m.oppNums=m.oppNums.filter(function(x){return x.num!==old;});
    m.goals.forEach(function(g){if(g.team==='them'&&g.num===old)g.num=n;});
  }
  var ex=byId2(m.oppNums,n);
  if(ex){ex.note=note||ex.note;}else m.oppNums.push({num:n,note:note});
  ui.sheet=null;commit();
}
async function doLogin(){
  var pw=$('#lPw').value;
  try{
    var ok=await rpc('check_pw',{pw:pw});
    if(ok===true){ADMIN=true;PW=pw;try{localStorage.setItem(LS+'-pw',pw);}catch(e){}ui.sheet=null;render();}
    else{var e1=$('#lErr');if(e1){e1.textContent='Wrong password.';e1.hidden=false;}}
  }catch(e){var e2=$('#lErr');if(e2){e2.textContent='Could not check. Try again.';e2.hidden=false;}}
}
function saveMatch(){
  var opp=$('#mOpp').value.trim();
  if(!opp){$('#mErr').hidden=false;$('#mOpp').focus();return;}
  var sq=[].slice.call(app.querySelectorAll('input[name=sq]:checked')).map(function(i){return i.value;});
  var vals={opp:opp,date:$('#mDate').value,comp:$('#mComp').value.trim(),meet:$('#mMeet').value,ko:$('#mKo').value,venue:$('#mVen').value.trim(),squad:sq};
  var id=ui.sheet.id,m=id?byId(S.matches,id):null;
  if(m){
    for(var k in vals)m[k]=vals[k];
    m.us=Math.max(0,toInt($('#mUs').value)||0);m.them=Math.max(0,toInt($('#mThem').value)||0);
  } else {
    m={id:uid(),status:'upcoming',us:0,them:0,goals:[],oppNums:[],teamId:ui.team,clock:{run:false,at:0,el:0}};
    for(var j in vals)m[j]=vals[j];
    var pl=app.querySelector('input[name=mStat]:checked');
    if(pl&&pl.value==='final'){m.status='final';m.us=Math.max(0,toInt($('#mUs').value)||0);m.them=Math.max(0,toInt($('#mThem').value)||0);}
    S.matches.push(m);ui.mid=m.id;ui.tab='match';
  }
  ui.sheet=null;commit();window.scrollTo(0,0);
}

app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||!S)return;
  var act=el.getAttribute('data-act');
  if(act==='backdrop'){if(e.target===el){ui.sheet=null;render();}return;}
  if(REMOTE&&!ADMIN&&['team','tab','close','pick','openMatch','adminBtn','doLogin','notify'].indexOf(act)<0)return;
  if(el.hasAttribute('data-confirm')&&el.getAttribute('data-sure')!=='1'){
    el.setAttribute('data-sure','1');el.setAttribute('data-label',el.textContent);
    el.textContent=el.classList.contains('x')?'Sure?':'Tap again to confirm';
    setTimeout(function(){if(el.isConnected){el.removeAttribute('data-sure');el.textContent=el.getAttribute('data-label');}},3000);
    return;
  }
  var m=curMatch();
  switch(act){
    case 'team':ui.team=el.getAttribute('data-t');ui.mid=null;ui.sheet=null;try{localStorage.setItem(LS+'-team',ui.team);}catch(err){}render();window.scrollTo(0,0);break;
    case 'tab':ui.tab=el.getAttribute('data-tab');ui.sheet=null;render();window.scrollTo(0,0);break;
    case 'close':ui.sheet=null;render();break;
    case 'notify':togglePush();break;
    case 'adminBtn':
      if(ADMIN){ADMIN=false;PW='';try{localStorage.removeItem(LS+'-pw');}catch(err){}ui.sheet=null;render();}
      else{ui.sheet={type:'login'};render();}
      break;
    case 'doLogin':doLogin();break;
    case 'pick':ui.sheet={type:'pick'};render();break;
    case 'openMatch':ui.mid=el.getAttribute('data-mid');ui.tab='match';ui.sheet=null;render();window.scrollTo(0,0);break;
    case 'newMatch':ui.sheet={type:'match',id:null};render();break;
    case 'editMatch':ui.sheet={type:'match',id:m.id};render();break;
    case 'saveMatch':saveMatch();break;
    case 'delMatch':S.matches=S.matches.filter(function(x){return x.id!==m.id;});ui.mid=null;ui.sheet=null;commit();break;
    case 'openUs':ui.sheet={type:'goalUs',min:clockMin(m)};render();break;
    case 'openThem':ui.sheet={type:'goalThem',min:clockMin(m)};render();break;
    case 'minAdj':var gi=$('#gMin');if(gi){var cv=toInt(gi.value);gi.value=Math.max(0,(cv===null?0:cv)+toInt(el.getAttribute('data-d')));}break;
    case 'quick':ui.sheet={type:'quick',id:m.id};render();break;
    case 'qAdd':var qm1=quickRead();if(qm1){var tm1=el.getAttribute('data-t');qm1.goals.push({id:uid(),team:tm1,min:null,scorer:null});if(qm1.goals.filter(function(x){return x.team===tm1;}).length>qm1[tm1])qm1[tm1]++;render();}break;
    case 'qDel':var qm2=quickRead();if(qm2){qm2.goals=qm2.goals.filter(function(x){return x.id!==el.getAttribute('data-gid');});render();}break;
    case 'qDone':var qm3=quickRead();if(qm3){['us','them'].forEach(function(t3){var c3=qm3.goals.filter(function(x){return x.team===t3;}).length;if(c3>qm3[t3])qm3[t3]=c3;});ui.sheet=null;toast('Saved');commit();}break;
    case 'addUs':addGoal('us',{scorer:el.getAttribute('data-pid')||null});break;
    case 'addThem':addThem(el.getAttribute('data-num'));break;
    case 'addThemTyped':addThem($('#gNum').value);break;
    case 'delGoal':var gid=el.getAttribute('data-gid');var g=byId(m.goals,gid);if(g){m.goals=m.goals.filter(function(x){return x!==g;});m[g.team]=Math.max(0,m[g.team]-1);}commit();break;
    case 'adj':adjust(el.getAttribute('data-t'));break;
    case 'status':
      var was=m.status;
      if(was==='upcoming'){m.status='live';m.clock={run:true,at:Date.now(),el:0,p:1,brk:false};}
      else if(was==='live'){stopClock(m);m.clock.brk=false;m.status='final';}
      else{m.status='live';}
      commit();
      if(was==='upcoming'){postWA(buildKickoff(m),m,'kick');pushNotify('Kick off: '+teamOf(m).name,'v '+m.opp+(m.ko?', KO '+fmtTime(m.ko):''),m);}
      else if(was==='live'){postWA(buildMsg(m),m,'ft');pushNotify('Full time: '+teamOf(m).name+' '+m.us+' - '+m.them+' '+m.opp,({W:'We won!',D:'A draw.',L:'Tough one.'})[result(m)],m);}
      break;
    case 'resetMatch':m.status='upcoming';m.us=0;m.them=0;m.goals=[];m.clock={run:false,at:0,el:0,p:1,brk:false};commit();break;
    case 'endPeriod':stopClock(m);m.clock.brk=true;commit();postWA(buildPeriod(m,false),m,'brk');pushNotify((teamOf(m).unit==='Quarter'?'Break':'Break')+': '+teamOf(m).name+' '+m.us+' - '+m.them+' '+m.opp,'End of '+teamOf(m).unit.toLowerCase()+' '+(m.clock.p||1),m);break;
    case 'nextPeriod':m.clock.p=(m.clock.p||1)+1;m.clock.el=0;m.clock.at=Date.now();m.clock.run=true;m.clock.brk=false;commit();postWA(buildPeriod(m,true),m,'start');break;
    case 'clockToggle':if(m.clock.run){stopClock(m);}else{m.clock.run=true;m.clock.at=Date.now();}commit();break;
    case 'clockAdj':var ne=Math.max(0,elapsed(m)+toInt(el.getAttribute('data-d'))*60000);m.clock.el=ne;m.clock.at=Date.now();commit();break;
    case 'share':ui.sheet={type:'share'};render();break;
    case 'shareOpen':var tx=$('#sText').value;try{navigator.clipboard.writeText(tx).catch(function(){});}catch(err){}flash('Message copied');openUrl(waUrl(tx,m?m.teamId:ui.team));break;
    case 'waSetup':ui.sheet={type:'wa'};render();break;
    case 'restoreOpen':ui.sheet={type:'restore'};render();break;
    case 'copyBackup':try{navigator.clipboard.writeText(JSON.stringify(S)).then(function(){flash('Backup copied');},function(){flash('Could not copy');});}catch(err){flash('Could not copy');}break;
    case 'doRestore':
      try{var obj=JSON.parse($('#rText').value);if(!obj||!Array.isArray(obj.players)||!Array.isArray(obj.matches))throw new Error('bad');setS(normalise(obj));ui.sheet=null;ui.mid=null;needSave=false;commit();}
      catch(err){var re=$('#rErr');if(re)re.hidden=false;}
      break;
    case 'shareMode':ui.sheet={type:'share',mode:el.getAttribute('data-mode')};render();break;
    case 'copyMsg':var ta=$('#sText');var txt=ta.value;try{navigator.clipboard.writeText(txt).then(function(){flash('Copied');},function(){ta.select();flash('Press and hold to copy');});}catch(err){ta.select();flash('Press and hold to copy');}break;
    case 'newOpp':ui.sheet={type:'opp',num:null};render();break;
    case 'editOpp':ui.sheet={type:'opp',num:el.getAttribute('data-num')};render();break;
    case 'saveOpp':saveOpp();break;
    case 'delOpp':m.oppNums=m.oppNums.filter(function(x){return x.num!==ui.sheet.num;});ui.sheet=null;commit();break;
    case 'addPlayer':addPlayer();break;
    case 'delPlayer':var pid=el.getAttribute('data-pid');S.players=S.players.filter(function(p){return p.id!==pid;});S.matches.forEach(function(x){x.squad=x.squad.filter(function(i){return i!==pid;});x.goals.forEach(function(g2){if(g2.scorer===pid)g2.scorer=null;});});commit();break;
  }
});
app.addEventListener('change',function(e){
  if(e.target.id==='waOn'){WA.on=e.target.checked;saveWA();flash(WA.on?'WhatsApp updates on':'WhatsApp updates off');return;}
  if(e.target.name==='waEv'){WA.ev=WA.ev||{};WA.ev[e.target.value]=e.target.checked;saveWA();return;}
  if(e.target.name&&e.target.name.indexOf('waMode_')===0){var tk=e.target.name.slice(7);WA.teams[tk]=WA.teams[tk]||{mode:'pick',link:''};WA.teams[tk].mode=e.target.value;saveWA();return;}
  var el=e.target;var f=el.getAttribute&&el.getAttribute('data-field');if(!f||!S)return;
  var p=byId(S.players,el.getAttribute('data-pid'));if(!p)return;
  if(f==='num'){p.num=cleanNum(el.value);el.value=p.num;}
  else if(f==='name'){var v=el.value.trim();if(!v){el.value=p.name;return;}p.name=v;}
  else if(f==='gk'){p.gk=el.checked;}
  save();
});
app.addEventListener('input',function(e){if(e.target.id&&e.target.id.indexOf('waLink_')===0){var tk2=e.target.id.slice(7);WA.teams[tk2]=WA.teams[tk2]||{mode:'pick',link:''};WA.teams[tk2].link=e.target.value.trim();saveWA();}if(e.target.id==='sText'){var a=document.getElementById('waLink');if(a)a.href='https://wa.me/?text='+encodeURIComponent(e.target.value);}});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&(e.target.id==='nName'||e.target.id==='nNum')){e.preventDefault();addPlayer();}
  if(e.key==='Enter'&&e.target.id==='lPw'){e.preventDefault();doLogin();}
  if(e.key==='Enter'&&e.target.id==='gNum'){e.preventDefault();addThem(e.target.value);}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet){ui.sheet=null;render();}});
app.addEventListener('focusout',function(){if(ui.defer){setTimeout(function(){var a=document.activeElement;if(!(a&&app.contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))){ui.defer=false;render();}},0);}});

function exists(snap){return typeof snap.exists==='function'?snap.exists():!!snap.exists;}
function failView(msg){
  S=null;
  app.innerHTML=headerHtml()+'<main><section class="card empty"><h2>Could not load</h2><p>'+esc(msg)+'</p><button class="btn primary" onclick="location.reload()">Try again</button></section></main>';
}
setInterval(function(){var c=document.getElementById('clk');if(!c||!S||!S.matches.length)return;var m=curMatch();if(!m||m.status!=='live')return;var e=elapsed(m);c.textContent=fmtClock(matchMs(m));var p=document.getElementById('clkp');if(p)p.textContent=clockLabel(m,e);},1000);
try{var st=localStorage.getItem(LS+'-team');if(st)ui.team=st;}catch(e){}
render();
setTimeout(function(){if(S===null&&!ui.failed){ui.failed=true;failView('The scorebook did not answer. Check your signal and try again.');}},9000);
(async function(){
  if(REMOTE){
    try{
      var d0=await fetchState();
      setS(normalise(d0));ui.failed=false;setStatus('saved');
      var spw=null;try{spw=localStorage.getItem(LS+'-pw');}catch(e){}
      if(spw){try{if((await rpc('check_pw',{pw:spw}))===true){ADMIN=true;PW=spw;}}catch(e){}}
      render();pushInit();
      if(!d0&&ADMIN){save();}
    }catch(e){ui.failed=true;failView('Could not load. '+String(e&&e.message||e));}
    setInterval(poll,5000);
  } else {
    var d=null;try{var raw=localStorage.getItem(LS);d=raw?JSON.parse(raw):null;}catch(e){}
    setS(normalise(d));needSave=false;setStatus('local');render();
  }
})();
})();
</script>
